name: System image build - stable

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - stable*
  workflow_dispatch:

jobs:
  build-docker-image:
    name: Build and publish docker container
    uses: ./.github/workflows/build-builder.yml

  list-pkgbuilds:
    name: List Packages
    runs-on: ubuntu-latest
    outputs:
      aur-pkgs: ${{ steps.set-aur-pkgs.outputs.matrix }}
      pkgs: ${{ steps.set-pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: set-aur-pkgs
        run: echo "matrix=$(ls -d aur-pkgs/*/ | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        shell: bash
      - id: set-pkgs
        run: echo "matrix=$(ls -d pkgs/*/ | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        shell: bash

  aur-pkgbuild:
    needs:
     - build-docker-image
     - list-pkgbuilds
    name: Build AUR package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.list-pkgbuilds.outputs.aur-pkgs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build packages
        run: |
          docker pull ${{ steps.meta.outputs.tags }}
          docker run --rm -v $(pwd):/workdir --entrypoint=/workdir/aur-pkgs/build-package.sh ${{ steps.meta.outputs.tags }} ${{ matrix.package }}
      - name: Process package name
        id: process_package
        run: |
          PACKAGE_NAME=${{ matrix.package }}
          PACKAGE_NAME=${PACKAGE_NAME#aur-pkgs/}
          PACKAGE_NAME=${PACKAGE_NAME%/}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
      
      - name: Generate checksums
        run: |
          docker run --rm -v $(pwd):/workdir --entrypoint=/bin/bash ${{ steps.meta.outputs.tags }} -c "cd /workdir/aur-pkgs && sha256sum *.pkg.tar* > sha256sums-${PACKAGE_NAME}.txt"
      - name: Upload Package Archives
        uses: actions/upload-artifact@v5
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        with:
            name: AUR-packages-${{ env.PACKAGE_NAME }}
            path: |
              aur-pkgs/*.pkg.tar*
              aur-pkgs/sha256sums-${{ env.PACKAGE_NAME }}.txt
            compression-level: 0
            overwrite: true
            retention-days: 3

  pkgbuild:
    needs:
     - build-docker-image
     - list-pkgbuilds
    name: Build package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.list-pkgbuilds.outputs.pkgs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build packages
        run: |
          docker pull ${{ steps.meta.outputs.tags }}
          docker run --rm -v $(pwd):/workdir --entrypoint=/workdir/pkgs/build-package.sh ${{ steps.meta.outputs.tags }} ${{ matrix.package }}
      
      - name: Process package name
        id: process_package
        run: |
          PACKAGE_NAME=${{ matrix.package }}
          PACKAGE_NAME=${PACKAGE_NAME#pkgs/}
          PACKAGE_NAME=${PACKAGE_NAME%/}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV 
     
      - name: Generate checksums for pkgs
        run: |
          docker run --rm -v $(pwd):/workdir --entrypoint=/bin/bash ${{ steps.meta.outputs.tags }} -c "cd /workdir/pkgs && sha256sum *.pkg.tar* > sha256sums-${PACKAGE_NAME}.txt"
      - name: Upload Package Archives
        uses: actions/upload-artifact@v5
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        with:
            name: Packages-${{ env.PACKAGE_NAME }}
            path: |
              pkgs/*.pkg.tar*
              pkgs/sha256sums-${PACKAGE_NAME}.txt
            compression-level: 0
            overwrite: true
            retention-days: 3

  build:
    needs:
      - build-docker-image
      - aur-pkgbuild
      - pkgbuild
    name: Build SkorionOS STABLE image
    uses: ./.github/workflows/build-system-image.yml
