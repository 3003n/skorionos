      - name: Get latest release information
        id: release_info
        run: |
          echo "🔍 获取最新创建的 release..."
          
          # 获取最新的 release（包括 prerelease）
          releases=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SkorionOS/skorionos/releases?per_page=5")
          
          # 按 created_at 排序，获取最新创建的 release
          release_info=$(echo "$releases" | jq 'sort_by(.created_at) | reverse | .[0]')
          
          tag_name=$(echo "$release_info" | jq -r '.tag_name')
          release_id=$(echo "$release_info" | jq -r '.id')
          release_url=$(echo "$release_info" | jq -r '.html_url')
          author=$(echo "$release_info" | jq -r '.author.login')
          is_prerelease=$(echo "$release_info" | jq -r '.prerelease')
          created_at=$(echo "$release_info" | jq -r '.created_at')
          
          # 计算 release 创建时间距现在多久（秒）
          created_timestamp=$(date -d "$created_at" +%s)
          current_timestamp=$(date +%s)
          age=$((current_timestamp - created_timestamp))
          
          echo "📦 找到 release: $tag_name"
          echo "🏷️  类型: $([ "$is_prerelease" = "true" ] && echo "Prerelease" || echo "Stable")"
          echo "🕐 创建时间: $created_at (${age}秒前)"
          echo "🔗 URL: $release_url"
          
          # 验证：release 应该是最近创建的（如 30 分钟内）
          max_age=1800  # 30 分钟
          if [ $age -gt $max_age ]; then
            echo "⚠️  警告: release 创建时间超过 ${max_age}秒，可能不是本次构建创建的"
            echo "   但仍然会继续处理..."
          fi
          
          # 获取 assets 信息
          assets_count=$(echo "$release_info" | jq '.assets | length')
          checksum_count=$(echo "$release_info" | jq '[.assets[] | select(.name | startswith("sha256sum-"))] | length')
          
          echo "📁 Assets: $assets_count (其中 checksum: $checksum_count)"
          
          # 输出
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "release_url=$release_url" >> $GITHUB_OUTPUT
          echo "author=$author" >> $GITHUB_OUTPUT
          echo "assets_count=$assets_count" >> $GITHUB_OUTPUT
          echo "checksum_count=$checksum_count" >> $GITHUB_OUTPUT
      
      - name: Log release information
        run: |
          echo "🎉 新的 SkorionOS release 发布!"
          echo "📦 版本: ${{ steps.release_info.outputs.tag_name }}"
          echo "🔗 链接: ${{ steps.release_info.outputs.release_url }}"
          echo "👤 发布者: ${{ steps.release_info.outputs.author }}"
          echo "📁 Assets 总数: ${{ steps.release_info.outputs.assets_count }}"
          echo "🔢 Checksum 文件数: ${{ steps.release_info.outputs.checksum_count }}"
      
      - name: Trigger SK-API-Info sync
        run: |
          # 触发 sk-api-info 仓库的同步
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_SK_API_INFO }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/honjow/sk-api-info/dispatches \
            -d "{
              \"event_type\": \"skorionos_release\",
              \"client_payload\": {
                \"tag\": \"${{ steps.release_info.outputs.tag_name }}\",
                \"release_id\": \"${{ steps.release_info.outputs.release_id }}\",
                \"release_url\": \"${{ steps.release_info.outputs.release_url }}\",
                \"author\": \"${{ steps.release_info.outputs.author }}\",
                \"assets_count\": ${{ steps.release_info.outputs.assets_count }},
                \"checksum_count\": ${{ steps.release_info.outputs.checksum_count }},
                \"triggered_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
                \"source_repo\": \"SkorionOS/skorionos\"
              }
            }"
      
      - name: Notify completion
        if: success()
        run: |
          echo "✅ 成功触发 sk-api-info 仓库同步"
          echo "🔄 sk-api-info 将在几秒钟内开始处理版本 ${{ steps.release_info.outputs.tag_name }}"
      
      - name: Handle failure
        if: failure()
        run: |
          echo "❌ 触发 sk-api-info 同步失败"
          echo "请检查 PAT_SK_API_INFO secret 是否正确配置"
          echo "或者手动触发 sk-api-info 仓库的同步 workflow"