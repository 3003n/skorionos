name: Build SkorionOS image matrix pkg
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      postfix:
        type: string
        description: Postfix used in release.
        default: ''

jobs:
  list-branches:
    name: List branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-branches
        # remove branch/ prefix
        run: echo "matrix=$(ls -1 branch/manifest-* | sed 's/branch\/manifest-//' | sed 's/\///' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        shell: bash
  
  build-system-image:
    name: Build image
    needs: list-branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.list-branches.outputs.branches) }}
    outputs:
      version: ${{ steps.build_image.outputs.version }}
      display_version: ${{ steps.build_image.outputs.display_version }}
      display_name: ${{ steps.build_image.outputs.display_name }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - uses: actions/checkout@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - uses: actions/download-artifact@v5
        with:
            pattern: pre-download
            merge-multiple: true
            path: pre-download/
      - name: Pre build image
        run: |
          env BUILD_BRANCH=${{ matrix.branch }} ./pre-build-image.sh
    
      
      - name: Build system image
        id: build_image
        run: |
          docker pull ${{ steps.meta.outputs.tags }}
          docker run -u root --rm --entrypoint=/workdir/build-image.sh -v $(pwd):/workdir -v $(pwd)/output:/output -v $GITHUB_OUTPUT:$GITHUB_OUTPUT -e "GITHUB_OUTPUT=$GITHUB_OUTPUT" -e "BUILD_BRANCH=${{ matrix.branch }}" --privileged=true ${{ steps.meta.outputs.tags }} $(echo ${GITHUB_SHA} | cut -c1-7)
          echo -e "$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.tags }})" > output/container-${{ matrix.branch }}.txt
      
      - name: list output
        run: |
          sudo chmod 644 output/*
          ls -lh output

      - name: Upload image
        uses: actions/upload-artifact@v5
        with:
          name: Build-image-${{ matrix.branch }}
          path: |
            output/${{ steps.build_image.outputs.image_filename_without_ext }}*
            output/build_info*.txt
            output/sha256sum*.txt
            output/container*.txt
          compression-level: 0
          overwrite: true

  publish-release:
    name: Publish release
    needs: build-system-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
          testing: false
      - name: Download image
        uses: actions/download-artifact@v5
        with:
          pattern: Build-image-*
          merge-multiple: true
          path: output/

      - name: Split image files
        run: |
          SPLIT_SIZE_GiB="${{ vars.SPLIT_SIZE_GIB }}"
          SPLIT_SIZE_GiB="${SPLIT_SIZE_GiB:-1.9}"
          SPLIT_SIZE_MiB=$(awk "BEGIN {printf \"%d\", ${SPLIT_SIZE_GiB} * 1024}")
          SPLIT_BYTES=$((SPLIT_SIZE_MiB * 1024 * 1024))
          echo "Split size: ${SPLIT_SIZE_GiB} GiB (${SPLIT_SIZE_MiB} MiB)"

          for IMG_FILENAME in output/skorionos*.skosys; do
            [ -f "${IMG_FILENAME}" ] || continue
            FILE_SIZE=$(stat -c %s "${IMG_FILENAME}")
            if [ "${FILE_SIZE}" -le "${SPLIT_BYTES}" ]; then
              echo "${IMG_FILENAME}: ${FILE_SIZE} bytes, no split needed"
              continue
            fi
            IMG_FILENAME_WITHOUT_EXT="${IMG_FILENAME%.skosys}"
            img_ext=".skosys"
            total_parts=$(((FILE_SIZE + SPLIT_BYTES - 1) / SPLIT_BYTES))
            echo "${IMG_FILENAME}: splitting into ${total_parts} parts"
            split -b ${SPLIT_SIZE_MiB}MiB -d -a 3 "${IMG_FILENAME}" "${IMG_FILENAME_WITHOUT_EXT}.part"
            for i in $(seq 1 $total_parts); do
              part_num=$(printf "%03d" $((i - 1)))
              mv "${IMG_FILENAME_WITHOUT_EXT}.part${part_num}" "${IMG_FILENAME_WITHOUT_EXT}.part${i}-${total_parts}${img_ext}"
            done
            rm "${IMG_FILENAME}"
          done

          # Recalculate sha256sum files to match actual published files (split parts)
          cd output
          for sum_file in sha256sum-*.txt; do
            [ -f "$sum_file" ] || continue
            branch="${sum_file#sha256sum-}"
            branch="${branch%.txt}"
            : > "$sum_file"
            for img in skorionos-*"-${branch}.skosys" skorionos-*"-${branch}.part"*".skosys"; do
              [ -f "$img" ] || continue
              sha256sum "$img" >> "$sum_file"
            done
            echo "Recalculated $sum_file:"
            cat "$sum_file"
          done
          cd ..

          echo "Split done, listing output/"
          ls -lh output/

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: _repo

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          RELEASE_TAG_NAME: ${{ needs.build-system-image.outputs.version }}
          RELEASE_TARGET_COMMITISH: ${{ github.sha }}
          RELEASE_NAME: "${{ needs.build-system-image.outputs.display_name }} ${{ needs.build-system-image.outputs.display_version }} ${{ inputs.postfix }}"
          RELEASE_PRERELEASE: "true"
          UPLOAD_CONCURRENCY: "${{ vars.UPLOAD_CONCURRENCY }}"
          RELEASE_FILES: |
            output/skorionos*
            output/build_info*.txt
            output/sha256sum*.txt
            output/container*.txt
        run: python3 _repo/.github/scripts/release-upload.py

  # ── Delta update generation (automatic) ──────────────────────────────

  list-delta-bases:
    name: List delta bases
    needs: [build-system-image, publish-release]
    if: vars.ENABLE_AUTO_DELTA != 'false'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find-bases.outputs.matrix }}
      has_bases: ${{ steps.find-bases.outputs.has_bases }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - id: find-bases
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
          DELTA_DEPTH: ${{ vars.DELTA_DEPTH || '1' }}
        run: bash .github/scripts/find-delta-bases.sh

  generate-delta:
    name: Delta ${{ matrix.branch }} from ${{ matrix.base_tag }}
    needs: [build-system-image, publish-release, list-delta-bases]
    if: needs.list-delta-bases.outputs.has_bases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-delta-bases.outputs.matrix) }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build-delta.sh
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download target and base images
        env:
          GH_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
          BASE_TAG: ${{ matrix.base_tag }}
          BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p images
          TARGET_IMG=$(bash .github/scripts/download-release-image.sh "$TARGET_TAG" "$BRANCH" images)
          echo "TARGET_IMG=$TARGET_IMG" >> "$GITHUB_ENV"
          BASE_IMG=$(bash .github/scripts/download-release-image.sh "$BASE_TAG" "$BRANCH" images)
          echo "BASE_IMG=$BASE_IMG" >> "$GITHUB_ENV"
          ls -lh images/

      - name: Generate delta
        env:
          BASE_TAG: ${{ matrix.base_tag }}
          MAX_DELTA_RATIO: ${{ vars.MAX_DELTA_RATIO || '70' }}
        run: |
          mkdir -p output
          sudo bash build-delta.sh \
            --target-img "$TARGET_IMG" \
            --base-img "$BASE_IMG" \
            --base-tag "$BASE_TAG" \
            --max-ratio "$MAX_DELTA_RATIO" \
            --output-dir output/
          sudo chown -R "$(id -u):$(id -g)" output/
          cat output/delta-status.txt

      - name: Upload delta artifact
        if: hashFiles('output/delta-status.txt') != '' && hashFiles('output/*.skdelta') != ''
        uses: actions/upload-artifact@v5
        with:
          name: Delta-${{ matrix.branch }}-from-${{ matrix.base_tag }}
          path: |
            output/*.skdelta
            output/delta-entry.json
            output/delta-sha256sum.txt
            output/delta-status.txt
          compression-level: 0
          overwrite: true

  publish-delta:
    name: Publish deltas
    needs: [build-system-image, publish-release, generate-delta]
    if: always() && needs.generate-delta.result != 'cancelled' && needs.generate-delta.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: _repo

      - name: Download all delta artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Delta-*
          path: deltas/

      - name: Merge manifests and split
        env:
          GH_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
          DELTAS_DIR: deltas
          OUTPUT_DIR: output
          SPLIT_SIZE_GIB: ${{ vars.SPLIT_SIZE_GIB || '1.9' }}
        run: bash _repo/.github/scripts/publish-delta.sh

      - name: Delete old delta assets
        if: env.has_deltas == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
        run: |
          existing_assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" \
            --jq '.assets[] | select(.name | test("\\.(skdelta)$") or test("^delta-manifest-")) | .id' 2>/dev/null || true)
          for asset_id in $existing_assets; do
            echo "Deleting old asset: $asset_id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" 2>/dev/null || true
          done

      - name: Upload deltas to release
        if: env.has_deltas == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          RELEASE_TAG_NAME: ${{ needs.build-system-image.outputs.version }}
          RELEASE_PRERELEASE: "true"
          UPLOAD_CONCURRENCY: "${{ vars.UPLOAD_CONCURRENCY }}"
          RELEASE_FILES: |
            output/*.skdelta
            output/delta-manifest-*.json
        run: python3 _repo/.github/scripts/release-upload.py

      - name: Trigger sk-api-info sync
        if: env.has_deltas == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
        run: |
          gh workflow run sync-skorionos.yml \
            -R honjow/sk-api-info \
            -f specific_tag="$TARGET_TAG" \
            -f force_resync=true || echo "Warning: failed to trigger sk-api-info sync"

      - name: Trigger cloud sync
        if: env.has_deltas == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SK_API_INFO }}
          TARGET_TAG: ${{ needs.build-system-image.outputs.version }}
        run: |
          gh workflow run sync-to-mobile-cloud.yml \
            -R "${GITHUB_REPOSITORY}" \
            -f tag_name="$TARGET_TAG" || echo "Warning: failed to trigger mobile cloud sync"
          gh workflow run sync-to-quark-cloud.yml \
            -R "${GITHUB_REPOSITORY}" \
            -f tag_name="$TARGET_TAG" || echo "Warning: failed to trigger quark cloud sync"
