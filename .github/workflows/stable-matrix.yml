name: System image matrix build - stable

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - matrix
  workflow_dispatch:

jobs:
  pre-download:
    name: Pre download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre download
        run: |
          ./predownload.sh
      - name: Upload Package Archives
        uses: actions/upload-artifact@v5
        with:
            name: pre-download
            if-no-files-found: error
            path: |
              pre-download/*.tar.gz
            compression-level: 0
            overwrite: true

  build-docker-image:
    needs:
      - pre-download
    name: Build and publish docker container
    uses: ./.github/workflows/build-builder.yml

  list-pkgbuilds:
    needs:
      - pre-download
    name: List Packages
    runs-on: ubuntu-latest
    outputs:
      aur-pkgs: ${{ steps.set-aur-pkgs.outputs.matrix }}
      pkgs: ${{ steps.set-pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: set-aur-pkgs
        run: echo "matrix=$(ls -d aur-pkgs/*/ | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        shell: bash
      - id: set-pkgs
        run: echo "matrix=$(ls -d pkgs/*/ | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        shell: bash

  aur-pkgbuild:
    needs:
     - build-docker-image
     - list-pkgbuilds
    name: Build AUR package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.list-pkgbuilds.outputs.aur-pkgs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build packages
        run: |
          docker pull ${{ steps.meta.outputs.tags }}
          docker run --rm -v $(pwd):/workdir --entrypoint=/workdir/aur-pkgs/build-package.sh ${{ steps.meta.outputs.tags }} ${{ matrix.package }}
      - name: Process package name
        id: process_package
        run: |
          PACKAGE_NAME=${{ matrix.package }}
          PACKAGE_NAME=${PACKAGE_NAME#aur-pkgs/}
          PACKAGE_NAME=${PACKAGE_NAME%/}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      # - name: Generate checksums
      #   run: |
      #     docker run --rm -v $(pwd):/workdir --entrypoint=/bin/bash ${{ steps.meta.outputs.tags }} -c "cd /workdir/aur-pkgs && sha256sum *.pkg.tar* > sha256sums-${PACKAGE_NAME}.txt"
      # - name: Fake build
      #   env:
      #     PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
      #   run: |
      #     mkdir -p aur-pkgs
      #     touch aur-pkgs/[${{ env.PACKAGE_NAME }}]-A.pkg.tar.zst
      #     touch aur-pkgs/[${{ env.PACKAGE_NAME }}]-B.pkg.tar.zst

      - name: Upload Package Archives
        uses: actions/upload-artifact@v5
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        with:
            name: AUR-packages-${{ env.PACKAGE_NAME }}
            path: |
              aur-pkgs/*.pkg.tar*
            compression-level: 0
            overwrite: true

  pkgbuild:
    needs:
     - build-docker-image
     - list-pkgbuilds
    name: Build package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.list-pkgbuilds.outputs.pkgs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build packages
        run: |
          docker pull ${{ steps.meta.outputs.tags }}
          docker run --rm -v $(pwd):/workdir --entrypoint=/workdir/pkgs/build-package.sh ${{ steps.meta.outputs.tags }} ${{ matrix.package }}

      - name: Process package name
        id: process_package
        run: |
          PACKAGE_NAME=${{ matrix.package }}
          PACKAGE_NAME=${PACKAGE_NAME#pkgs/}
          PACKAGE_NAME=${PACKAGE_NAME%/}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV 
     
      # - name: Fake build
      #   env:
      #     PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
      #   run: |
      #     mkdir -p pkgs
      #     touch pkgs/[${{ env.PACKAGE_NAME }}]-A.pkg.tar.zst
      #     touch pkgs/[${{ env.PACKAGE_NAME }}]-B.pkg.tar.zst

      - name: Upload Package Archives
        uses: actions/upload-artifact@v5
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        with:
            name: Packages-${{ env.PACKAGE_NAME }}
            path: |
              pkgs/*.pkg.tar*
            compression-level: 0
            overwrite: true

  build:
    needs:
      - build-docker-image
      - aur-pkgbuild
      - pkgbuild
    name: Build SkorionOS STABLE image matrix
    uses: ./.github/workflows/build-system-image-matrix.yml
    secrets: inherit